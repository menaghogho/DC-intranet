<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | Digital Champions Intranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='assets/ipc-logo.png') }}" alt="IPC Coventry and Warwickshire — Digital Champions">
    <h1>Sign in</h1>
    <p class="sub"> Digital Champions intranet</p>

    <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">

      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <button type="submit">Sign in</button>
    </form>

    <p class="switch">New here? <a href="{{ url_for('register') }}">Create a staff account</a></p>
  </div>
</body>
</html>
