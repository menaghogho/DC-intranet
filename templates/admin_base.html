<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} | Digital Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="topbar">
    <div class="wrap admin-topbar-inner">
      <a class="brand" href="{{ url_for('admin_staff') }}">
        <img src="{{ url_for('static', filename='assets/ipc-logo.png') }}" alt="IPC Coventry and Warwickshire — Digital Champions">
        <span>Digital Champions &middot; Admin</span>
      </a>
      <div class="acct">
        <span>{{ current_user.name }} &middot; {{ 'Root admin' if current_user.is_root_admin else 'Admin' }}</span>
        <a href="{{ url_for('about') }}">Back to site</a>
        <form method="post" action="{{ url_for('logout') }}" class="signout-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="linklike">Sign out</button>
        </form>
      </div>
    </div>
  </div>

  {% block content %}{% endblock %}

  <footer>Digital Champions Admin &middot; internal use only</footer>

</body>
</html>
